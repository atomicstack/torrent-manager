{{if not .Items}}
<tr><td colspan="4" class="empty">no matches</td></tr>
{{end}}
{{range .Items}}
<tr data-feed="{{.FeedName}}" data-guid="{{.GUID}}" data-hash="{{.InfoHash}}">
  <td class="cell-feed">{{.FeedName}}</td>
  <td class="cell-seen" data-ts="{{.FirstSeenAt}}" title="{{iso .FirstSeenAt}}">{{ago .FirstSeenAt}}</td>
  <td class="cell-status">
    {{if .Enqueued}}
      <span class="badge badge-enqueued">enqueued</span>
      {{- if eq .EnqueueSource "auto"}}
      <span class="badge badge-auto" title="enqueued by tmgr from a watchlist rule">auto</span>
      {{- else if eq .EnqueueSource "manual"}}
      <span class="badge badge-manual" title="enqueued by hand from the web ui">manual</span>
      {{- end}}
    {{end}}
  </td>
  <td class="cell-title">
    <a class="cell-title-link" href="#"
       hx-get="/api/enqueue-confirm?feed={{.FeedName | urlquery}}&guid={{.GUID | urlquery}}"
       hx-target="#modal" hx-swap="innerHTML"
       onclick="event.preventDefault()">{{.Title}}</a>
  </td>
</tr>
{{end}}
<script>window.cachedMeta = Object.assign(window.cachedMeta || {}, {{.MetaMap}});</script>
