{{if not .Items}}
<tr><td colspan="4" class="empty">no matches</td></tr>
{{end}}
{{range .Items}}
<tr data-feed="{{.FeedName}}" data-guid="{{.GUID}}" data-hash="{{.InfoHash}}">
  <td class="cell-meta">
    <span class="cell-feed">{{.FeedName}}</span>
    <span class="cell-meta-sep">·</span>
    <span class="cell-seen" title="{{iso .FirstSeenAt}}">{{ago .FirstSeenAt}}</span>
  </td>
  <td class="cell-title"><a href="{{.Link}}" target="_blank" rel="noopener">{{.Title}}</a></td>
  <td class="cell-status">
    {{if .Enqueued}}
      <span class="badge badge-enqueued">enqueued</span>
    {{end}}
  </td>
  <td class="cell-action">
    {{- if .Enqueued -}}
    <button class="btn-enqueue" disabled title="already enqueued">enqueued</button>
    {{- else if .MatchedRule -}}
    <button class="btn-enqueue"
            hx-get="/api/enqueue-confirm?feed={{.FeedName | urlquery}}&guid={{.GUID | urlquery}}"
            hx-target="#modal" hx-swap="innerHTML">enqueue</button>
    {{- else -}}
    <button class="btn-enqueue"
            hx-get="/api/enqueue-confirm?feed={{.FeedName | urlquery}}&guid={{.GUID | urlquery}}"
            hx-target="#modal" hx-swap="innerHTML">enqueue</button>
    {{- end -}}
  </td>
</tr>
{{end}}
