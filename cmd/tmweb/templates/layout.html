<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tmweb</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <header>
    <h1>torrents</h1>
    <form id="search" class="search-bar"
          hx-get="/api/search"
          hx-trigger="input changed delay:250ms from:input[type=search], change, load"
          hx-target="#rows" hx-swap="innerHTML">
      <span class="search-input-wrap">
        <input id="search-q" type="search" name="q" placeholder="search by title…" autofocus>
        <button type="button" class="search-clear" aria-label="clear search"
                onclick="var i=document.getElementById('search-q'); i.value=''; i.dispatchEvent(new Event('input', {bubbles:true})); i.focus();">×</button>
      </span>
      <select name="feed_filter">
        <option value="">all feeds</option>
        {{range .Feeds}}
        <option value="{{.}}">{{.}}</option>
        {{end}}
      </select>
      <label><input type="checkbox" name="include_enqueued" value="1" checked> include enqueued</label>
    </form>
  </header>
  <main>
    <table>
      <thead>
        <tr><th>feed · first seen</th><th>title</th><th>status</th><th></th></tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="4" class="empty">loading…</td></tr>
      </tbody>
    </table>
  </main>
  <div id="modal"></div>
</body>
</html>
