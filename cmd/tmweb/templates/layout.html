<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tmweb</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <header>
    <h1>torrents</h1>
    <form id="search" class="search-bar"
          hx-get="/api/search"
          hx-trigger="input changed delay:250ms from:input[type=search],
                      change from:select,
                      change from:input[type=hidden],
                      load"
          hx-target="#rows" hx-swap="innerHTML">
      <span class="search-input-wrap">
        <input id="search-q" type="search" name="q" placeholder="search by title…" autofocus>
        <button type="button" class="search-clear" aria-label="clear search"
                onclick="var i=document.getElementById('search-q'); i.value=''; i.dispatchEvent(new Event('input', {bubbles:true})); i.focus();">×</button>
      </span>
      <select name="feed_filter">
        <option value="">all feeds</option>
        {{range .Feeds}}
        <option value="{{.}}">{{.}}</option>
        {{end}}
      </select>
      <select name="enqueued_filter">
        <option value="all" selected>all</option>
        <option value="enqueued">enqueued</option>
        <option value="">unenqueued</option>
      </select>
      <!-- hidden state driven by the column headers + pagination buttons.
           kept in the form so htmx submits them automatically as part of
           every /api/search request. -->
      <input type="hidden" name="page" value="1">
      <input type="hidden" name="sort_field" value="">
      <input type="hidden" name="sort_dir" value="">
    </form>
  </header>
  <main>
    <table>
      <thead>
        <tr>
          <th data-sort="first_seen_at" class="sortable" title="sort by first seen">feed · first seen <span class="sort-arrow"></span></th>
          <th data-sort="title" class="sortable" title="sort by title">title <span class="sort-arrow"></span></th>
          <th data-sort="enqueued" class="sortable" title="sort by enqueue state">status <span class="sort-arrow"></span></th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="3" class="empty">loading…</td></tr>
      </tbody>
    </table>
    <div class="pagination-bar">
      <!-- #pagination is OOB-swapped by /api/search responses. -->
      <div id="pagination"></div>
      <!-- per_page belongs to the search form (form="search") so htmx
           serialises it on submit even though it lives outside the
           form's DOM subtree, where it visually sits next to the
           pagination controls. -->
      <label class="per-page-label">
        rows / page
        <select name="per_page" form="search" title="rows per page">
          <option value="25">25</option>
          <option value="50" selected>50</option>
          <option value="100">100</option>
          <option value="200">200</option>
          <option value="500">500</option>
        </select>
      </label>
    </div>
  </main>
  <script>
  // URL <-> filter-form sync, header-click sort, and pagination clicks.
  // This script lives AFTER </main> on purpose: it references elements that
  // appear later in the document (the th.sortable headers, the per_page
  // <select form="search"> that lives outside the form's DOM subtree). It's
  // still inline + synchronous so the form is populated BEFORE htmx's
  // hx-trigger="load" fires the initial search on DOMContentLoaded — a
  // reload of /?q=foo&sort_field=title mustn't briefly search with
  // q=""/no-sort.
  //
  // The form holds the full search state (q, feed_filter, enqueued_filter,
  // per_page, page, sort_field, sort_dir). htmx serialises every input on
  // each /api/search submit, so we just keep the inputs in sync with what
  // the user clicked and let htmx do the request.
  (function () {
    var form = document.getElementById('search');
    if (!form) return;

    // 1. Seed inputs from the URL on load.
    var params = new URLSearchParams(location.search);
    if (params.has('q')) form.q.value = params.get('q');
    if (params.has('feed_filter')) form.feed_filter.value = params.get('feed_filter');
    if (params.has('enqueued_filter')) form.enqueued_filter.value = params.get('enqueued_filter');
    if (params.has('per_page')) form.per_page.value = params.get('per_page');
    if (params.has('page')) form.page.value = params.get('page');
    if (params.has('sort_field')) form.sort_field.value = params.get('sort_field');
    if (params.has('sort_dir')) form.sort_dir.value = params.get('sort_dir');

    // 2. URL ← form. Run on every input/change so the address bar matches
    //    what the user sees. Always emit the explicit values so a reload
    //    restores the same view (replaceState is cheap; no debounce).
    function syncURL() {
      var p = new URLSearchParams();
      if (form.q.value) p.set('q', form.q.value);
      if (form.feed_filter.value) p.set('feed_filter', form.feed_filter.value);
      p.set('enqueued_filter', form.enqueued_filter.value);
      p.set('per_page', form.per_page.value);
      p.set('page', form.page.value);
      if (form.sort_field.value) p.set('sort_field', form.sort_field.value);
      if (form.sort_dir.value) p.set('sort_dir', form.sort_dir.value);
      var qs = p.toString();
      var target = qs ? location.pathname + '?' + qs : location.pathname;
      if (location.pathname + location.search !== target) {
        history.replaceState(null, '', target);
      }
    }
    form.addEventListener('input', syncURL);
    form.addEventListener('change', syncURL);

    // 3. Filter / per_page / sort changes invalidate the current page —
    //    snap back to 1 before htmx fires the search request so the user
    //    never sees an empty result on a now-out-of-range page.
    function resetPage() { form.page.value = '1'; }
    ['q', 'feed_filter', 'enqueued_filter', 'sort_field', 'sort_dir'].forEach(function (name) {
      var el = form.elements[name];
      if (el) el.addEventListener('change', resetPage);
    });
    // q is a search input — input events too (change only fires on blur).
    form.q.addEventListener('input', resetPage);

    // per_page lives OUTSIDE the form's DOM subtree (positioned next to
    // the pagination bar at the bottom of the page) via form="search".
    // Change events don't bubble to the form, so htmx's "change from:
    // select" filter never fires for it — wire it explicitly: reset the
    // page, mirror to URL, then dispatch a synthetic change on the
    // (in-form) hidden page input so htmx's "change from:input[type=
    // hidden]" trigger picks it up and refires /api/search.
    form.elements.per_page.addEventListener('change', function () {
      resetPage();
      syncURL();
      form.page.dispatchEvent(new Event('change', { bubbles: true }));
    });

    // 4. Sortable column headers. Each <th data-sort="..."> click sets
    //    sort_field; if the same field is clicked again, flip sort_dir.
    //    Per-field default direction: time/size columns prefer desc,
    //    text columns prefer asc — matches what reads naturally.
    var descByDefault = { first_seen_at: true, last_seen_at: true, total_bytes: true, enqueued: true };
    function updateSortArrows() {
      var sf = form.sort_field.value, sd = form.sort_dir.value;
      document.querySelectorAll('th.sortable').forEach(function (th) {
        var arrow = th.querySelector('.sort-arrow');
        if (!arrow) return;
        if (th.dataset.sort === sf) {
          arrow.textContent = sd === 'asc' ? '↑' : '↓';
          th.classList.add('sorted');
        } else {
          arrow.textContent = '';
          th.classList.remove('sorted');
        }
      });
    }
    updateSortArrows();
    document.querySelectorAll('th.sortable').forEach(function (th) {
      th.addEventListener('click', function () {
        var field = th.dataset.sort;
        if (form.sort_field.value === field) {
          form.sort_dir.value = (form.sort_dir.value === 'asc') ? 'desc' : 'asc';
        } else {
          form.sort_field.value = field;
          form.sort_dir.value = descByDefault[field] ? 'desc' : 'asc';
        }
        updateSortArrows();
        // dispatch a synthetic change so htmx + syncURL + resetPage all fire.
        form.sort_field.dispatchEvent(new Event('change', { bubbles: true }));
      });
    });

    // 5. Pagination clicks (event-delegation on the container so newly
    //    OOB-swapped buttons keep working). Each .page-btn carries
    //    data-page="<n>" — set the form's page input and dispatch a
    //    change event on it; the form's hx-trigger picks up hidden-input
    //    changes and refires the search. We deliberately set page BEFORE
    //    the resetPage listeners would clobber it; pagination clicks are
    //    not subject to resetPage (page is the field they're driving).
    document.addEventListener('click', function (ev) {
      var btn = ev.target.closest && ev.target.closest('.page-btn');
      if (!btn || btn.disabled) return;
      var n = btn.dataset.page;
      if (!n) return;
      form.page.value = n;
      syncURL();
      form.page.dispatchEvent(new Event('change', { bubbles: true }));
    });

    // 6. Refresh sort arrows after each rows swap (in case the user
    //    reloaded a page with an explicit sort and the arrows need to
    //    re-render against the seeded form state).
    document.body.addEventListener('htmx:afterSwap', function (ev) {
      if (ev.target && (ev.target.id === 'rows' || ev.target.id === 'pagination')) {
        updateSortArrows();
      }
    });
  })();
  </script>
  <div id="modal"></div>
  <script>
  // rewrite the timestamp tooltips into the browser's local timezone so the
  // user sees a familiar offset instead of UTC. The server emits the unix
  // epoch in data-ts plus a UTC fallback in title, so anyone with JS off
  // still gets a usable tooltip.
  (function () {
    function pad(n) { return String(n).padStart(2, '0'); }
    function localISO(d) {
      var tz = -d.getTimezoneOffset(); // minutes east of UTC
      var sign = tz >= 0 ? '+' : '-';
      var abs = Math.abs(tz);
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
        + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds())
        + sign + pad(Math.floor(abs / 60)) + ':' + pad(abs % 60);
    }
    function rewrite(scope) {
      (scope || document).querySelectorAll('[data-ts]').forEach(function (el) {
        var ts = parseInt(el.dataset.ts, 10);
        if (!ts) return;
        el.title = localISO(new Date(ts * 1000));
      });
    }
    document.addEventListener('DOMContentLoaded', function () { rewrite(document); });
    // htmx fires htmx:load for every newly-added subtree (each swap of #rows
    // counts), so the rewrite runs against the freshly-rendered table body.
    document.body.addEventListener('htmx:load', function (e) { rewrite(e.target); });

    // press '/' anywhere to focus the search box. swallowed if a text input
    // (or textarea / contenteditable) already has focus so typing '/' in the
    // search box / modal save_dir field still works.
    function isTextField(el) {
      if (!el) return false;
      if (el.isContentEditable) return true;
      if (el.tagName === 'TEXTAREA') return true;
      if (el.tagName === 'INPUT') {
        var t = (el.type || '').toLowerCase();
        return ['text', 'search', 'email', 'url', 'tel', 'password', 'number'].indexOf(t) >= 0;
      }
      return false;
    }
    document.addEventListener('keydown', function (e) {
      if (e.key !== '/' || e.ctrlKey || e.metaKey || e.altKey) return;
      if (isTextField(document.activeElement)) return;
      var q = document.getElementById('search-q');
      if (!q) return;
      e.preventDefault();
      q.focus();
      q.select();
    });

    // press escape to dismiss any open modal. handled at document level so
    // the modal doesn't need a focusable wrapper to receive the key event.
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      var modal = document.getElementById('modal');
      if (modal && modal.innerHTML.trim() !== '') {
        modal.innerHTML = '';
      }
    });
  })();

  // startClassify drives the ✨ claude-classify flow over server-sent events.
  // each server-side phase emits a "step" event (fetching → parsing →
  // caching → querying); the parsed metadata arrives as a "meta" event
  // that OOB-replaces the modal's #torrent-meta dl; the final form-row
  // arrives as a "form" event and is swapped into the modal in place of
  // the form-row-block the user clicked from. all step transitions are
  // driven by real backend progress — no CSS time-based animations.
  var classifyES = null;  // single in-flight EventSource per page
  function startClassify(btn) {
    var formRowBlock = btn.closest('.form-row-block');
    if (!formRowBlock) return;
    var url = btn.dataset.classifyUrl;
    if (!url) return;
    if (classifyES) { classifyES.close(); classifyES = null; }

    formRowBlock.classList.add('classifying');
    // reset step state from any previous attempt living in the same dom.
    formRowBlock.querySelectorAll('.classify-loading .step').forEach(function (li) {
      li.classList.remove('step-active', 'step-done');
    });

    var stepIdx = { fetching: 1, parsing: 2, caching: 3, querying: 4 };
    var lastIdx = null;
    var done = false;
    var markDone = function () {
      if (!lastIdx) return;
      var prev = formRowBlock.querySelector('.classify-step-' + lastIdx);
      if (prev) { prev.classList.remove('step-active'); prev.classList.add('step-done'); }
    };

    var es = new EventSource(url);
    classifyES = es;

    es.addEventListener('step', function (ev) {
      var idx = stepIdx[ev.data];
      if (!idx) return;
      markDone();
      lastIdx = idx;
      var cur = formRowBlock.querySelector('.classify-step-' + idx);
      if (cur) cur.classList.add('step-active');
    });

    es.addEventListener('meta', function (ev) {
      var wrap = document.createElement('div');
      wrap.innerHTML = ev.data;
      var newDl = wrap.firstElementChild;
      var cur = document.getElementById('torrent-meta');
      if (cur && newDl) cur.replaceWith(newDl);
    });

    es.addEventListener('form', function (ev) {
      markDone();
      done = true;
      // brief pause so the final "done" tick is visible before we swap
      // the form-row-block out from under it.
      setTimeout(function () {
        var wrap = document.createElement('div');
        wrap.innerHTML = ev.data;
        var newBlock = wrap.firstElementChild;
        if (newBlock) {
          formRowBlock.replaceWith(newBlock);
          if (window.htmx) window.htmx.process(newBlock);
        }
        es.close();
        classifyES = null;
      }, 200);
    });

    es.onerror = function () {
      // EventSource also raises onerror on a normal server-side close.
      // only flag a problem if we haven't received the final form event.
      if (!done) {
        formRowBlock.classList.remove('classifying');
        // surface the failure inline so the modal stays useful — the user
        // can still type a path manually and submit.
        var ll = formRowBlock.querySelector('.classify-loading');
        if (ll) ll.innerHTML = '<p class="modal-note">classify stream interrupted — fill in the destination manually.</p>';
      }
      es.close();
      classifyES = null;
    };
  }
  </script>
</body>
</html>
