<div class="modal-bg" hx-on:click="document.getElementById('modal').innerHTML=''">
  <div class="modal-card" onclick="event.stopPropagation()">
    <h2>enqueue</h2>
    <dl>
      <dt>title</dt>     <dd>{{.Item.Title}}</dd>
      <dt>feed</dt>      <dd>{{.Item.FeedName}}</dd>
      <dt>rule</dt>      <dd>{{.Item.MatchedRule}}</dd>
      <dt>save dir</dt>  <dd class="mono">{{if .SaveDir}}{{.SaveDir}}{{else}}<em>(default download dir)</em>{{end}}</dd>
      {{if .Item.InfoHash}}
      <dt>info hash</dt> <dd class="mono">{{.Item.InfoHash}}</dd>
      {{end}}
    </dl>
    <div class="modal-actions">
      <button class="btn-cancel"
              hx-on:click="document.getElementById('modal').innerHTML=''">cancel</button>
      <button class="btn-enqueue btn-primary"
              hx-post="/api/enqueue?feed={{.Item.FeedName | urlquery}}&guid={{.Item.GUID | urlquery}}"
              hx-target="#rows" hx-swap="innerHTML"
              hx-on::after-request="document.getElementById('modal').innerHTML=''">confirm</button>
    </div>
  </div>
</div>
