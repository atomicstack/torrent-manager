<div class="modal-bg" hx-on:click="document.getElementById('modal').innerHTML=''">
  <div class="modal-card" onclick="event.stopPropagation()">
    <h2>enqueue</h2>
    <dl>
      <dt>title</dt> <dd>{{.Item.Title}}</dd>
      <dt>feed</dt>  <dd>{{.Item.FeedName}}</dd>
      <dt>rule</dt>  <dd>{{.Item.MatchedRule}}</dd>
      {{if .Item.InfoHash}}<dt>info hash</dt><dd class="mono">{{.Item.InfoHash}}</dd>{{end}}
    </dl>
    <form hx-post="/api/enqueue?feed={{.Item.FeedName | urlquery}}&guid={{.Item.GUID | urlquery}}"
          hx-include="#search"
          hx-target="#rows" hx-swap="innerHTML"
          hx-on::after-request="document.getElementById('modal').innerHTML=''">
      <div class="form-row-block">
        <label class="form-row">
          <span>save dir{{if .CommonRoot}} <span class="form-prefix" title="{{.CommonRoot}}">(under {{.CommonRoot}})</span>{{end}}</span>
          <span class="path-input-wrap">
            <input type="text" name="save_dir" value="{{.SaveDir}}"
                   list="path-completions" autocomplete="off" spellcheck="false"
                   placeholder="empty = rtorrent default download dir">
          </span>
        </label>
      </div>
      {{if .Completions}}
      <datalist id="path-completions">
        {{range .Completions}}<option value="{{.}}">{{end}}
      </datalist>
      {{end}}
      <div class="modal-actions">
        <button type="button" class="btn-cancel"
                hx-on:click="document.getElementById('modal').innerHTML=''">cancel</button>
        <button type="submit" class="btn-enqueue btn-primary">confirm</button>
      </div>
      {{template "_enqueue_progress.html" .}}
    </form>
  </div>
</div>
