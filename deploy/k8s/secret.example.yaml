# template only — NEVER commit a real secret. workflow:
#   $ kubectl -n torrent-manager create secret generic tmgr-cookies \
#       --from-literal=TRACKER_A_COOKIE='<paste cookie>' \
#       --from-literal=TRACKER_X_COOKIE='<more cookies as needed>'
#   $ kubectl -n torrent-manager create secret generic tmgr-tls \
#       --from-file=ca.crt=certs/ca.crt \
#       --from-file=client.crt=certs/client.crt \
#       --from-file=client.key=certs/client.key
#   $ kubectl -n torrent-manager create secret generic tmgr-anthropic \
#       --from-literal=ANTHROPIC_API_KEY='<paste key>'
#   $ kubectl -n torrent-manager create secret generic tmgr-mqtt \
#       --from-literal=MQTT_URL='tcp://<broker lan ip>:1883' \
#       --from-literal=MQTT_USERNAME='<user>' \
#       --from-literal=MQTT_PASSWORD='<password>'
#     (optional: MQTT_TOPIC, default torrent-manager/complete. use the broker's
#     ip — pods can't resolve mDNS .local names.)
apiVersion: v1
kind: Secret
metadata:
  name: tmgr-cookies
  namespace: torrent-manager
type: Opaque
stringData:
  TRACKER_A_COOKIE: "REPLACE_ME"
  # add more cookie keys as needed, one per tracker that requires a cookie
---
apiVersion: v1
kind: Secret
metadata:
  name: tmgr-tls
  namespace: torrent-manager
type: Opaque
data:
  ca.crt: ""        # base64 of certs/ca.crt
  client.crt: ""    # base64 of certs/client.crt
  client.key: ""    # base64 of certs/client.key
---
apiVersion: v1
kind: Secret
metadata:
  name: tmgr-anthropic
  namespace: torrent-manager
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: tmgr-mqtt
  namespace: torrent-manager
type: Opaque
stringData:
  MQTT_URL: "tcp://REPLACE_ME:1883"
  MQTT_USERNAME: "REPLACE_ME"
  MQTT_PASSWORD: "REPLACE_ME"
  # MQTT_TOPIC: "torrent-manager/complete"
