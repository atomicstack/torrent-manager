apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tmweb
  namespace: torrent-manager
  annotations:
    # k3s default ingress controller is traefik.
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: tmgr.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tmweb
                port:
                  number: 80
