apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tmgr-cache
  namespace: torrent-manager
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 64Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tmgr
  namespace: torrent-manager
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          securityContext:
            # match runAsUser so secret/configmap mounts are readable to the pod
            fsGroup: 65532
          containers:
            - name: tmgr
              # local image preloaded onto every node via `make image-import`.
              # containerd normalises `local/tmgr:latest` -> `docker.io/local/tmgr:latest`,
              # so the ref below must match what `k3s ctr images list` shows.
              image: docker.io/local/tmgr:latest
              imagePullPolicy: Never
              args:
                - --watchlist=/etc/tmgr/watchlist.yaml
                - --ca=/etc/tmgr/tls/ca.crt
                - --cert=/etc/tmgr/tls/client.crt
                - --key=/etc/tmgr/tls/client.key
                - --cache-file=/var/cache/tmgr/seen.db
                # safety throttle. flip to --mode=fetch once observe logs look right,
                # then to --mode=enqueue (or drop the flag — enqueue is the default).
                - --mode=enqueue
              envFrom:
                - secretRef:
                    name: tmgr-cookies
                - secretRef:
                    name: tmgr-anthropic
              volumeMounts:
                - name: watchlist
                  mountPath: /etc/tmgr
                - name: tls
                  mountPath: /etc/tmgr/tls
                  readOnly: true
                - name: cache
                  mountPath: /var/cache/tmgr
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              securityContext:
                runAsUser: 65532
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: watchlist
              configMap:
                name: tmgr-watchlist
            - name: tls
              secret:
                secretName: tmgr-tls
                defaultMode: 0440   # owner+group read; fsGroup=65532 grants the pod group access
            - name: cache
              persistentVolumeClaim:
                claimName: tmgr-cache
