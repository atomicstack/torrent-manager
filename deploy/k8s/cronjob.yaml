apiVersion: batch/v1
kind: CronJob
metadata:
  name: tmgr
  namespace: torrent-manager
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: tmgr
              image: ghcr.io/atomicstack/tmgr:dev   # overridden by kustomize image tag
              imagePullPolicy: IfNotPresent
              args:
                - --watchlist=/etc/tmgr/watchlist.yaml
                - --ca=/etc/tmgr/tls/ca.crt
                - --cert=/etc/tmgr/tls/client.crt
                - --key=/etc/tmgr/tls/client.key
                # safety throttle. flip to --mode=fetch once observe logs look right,
                # then to --mode=enqueue (or drop the flag — enqueue is the default).
                - --mode=observe
              envFrom:
                - secretRef:
                    name: tmgr-cookies
                - secretRef:
                    name: tmgr-anthropic
              volumeMounts:
                - name: watchlist
                  mountPath: /etc/tmgr
                - name: tls
                  mountPath: /etc/tmgr/tls
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              securityContext:
                runAsUser: 65532
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: watchlist
              configMap:
                name: tmgr-watchlist
            - name: tls
              secret:
                secretName: tmgr-tls
                defaultMode: 0400
