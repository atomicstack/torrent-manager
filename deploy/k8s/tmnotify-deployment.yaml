apiVersion: apps/v1
kind: Deployment
metadata:
  name: tmnotify
  namespace: torrent-manager
  labels: { app: tmnotify }
spec:
  # exactly one: every replica would follow the completion stream and
  # publish, so two pods means duplicate notifications.
  replicas: 1
  selector:
    matchLabels: { app: tmnotify }
  strategy:
    # a rolling update briefly runs old + new side by side (see above).
    type: Recreate
  template:
    metadata:
      labels: { app: tmnotify }
    spec:
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: tmnotify
          image: docker.io/local/tmnotify:latest
          imagePullPolicy: Never
          args:
            - --seedctl-url=https://seedbox.example.com:18443
            - --watchlist=/etc/tmgr/watchlist.yaml
            - --ca=/etc/tmgr/tls/ca.crt
            - --cert=/etc/tmgr/tls/client.crt
            - --key=/etc/tmgr/tls/client.key
            - --health-listen=:8081
          envFrom:
            # MQTT_URL / MQTT_USERNAME / MQTT_PASSWORD / MQTT_TOPIC. see
            # secret.example.yaml. tmnotify exits if MQTT_URL is unset.
            - secretRef: { name: tmgr-mqtt }
          ports:
            - name: health
              containerPort: 8081
          livenessProbe:
            # unhealthy = broker disconnected, or the seedctl stream down >5m.
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - name: tls
              mountPath: /etc/tmgr/tls
              readOnly: true
            - name: watchlist
              mountPath: /etc/tmgr
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: tmgr-tls
            defaultMode: 0440
        - name: watchlist
          configMap:
            name: tmgr-watchlist
